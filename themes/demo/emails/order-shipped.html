<!doctype html><html lang="{{.Page.Locale}}"><head><meta charset="utf-8"><title>{{t "OrderShippedSubject"}} {{.Data.Order.Number}}</title></head>
<body style="margin:0;padding:24px;background:#f6f7f9;font:14px/1.5 system-ui,sans-serif;color:#16181d">
<div style="max-width:560px;margin:0 auto;background:#fff;padding:24px">
<h1 style="font-size:20px">{{t "OrderShippedSubject"}} {{.Data.Order.Number}}</h1>
<p>{{t "OrderShippedIntro"}}</p>
{{range .Data.Order.Fulfillments}}<p>{{.Carrier}} {{.TrackingNumber}}{{with .TrackingURL}} · <a href="{{.}}">{{t "Track"}}</a>{{end}}</p>{{end}}
<p><a href="{{.Data.Order.URL}}" style="display:inline-block;padding:10px 18px;background:#2f6feb;color:#fff;text-decoration:none">{{t "ViewOrder"}}</a></p>
</div></body></html>
