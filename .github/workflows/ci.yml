# example 的持续集成：Go 编译 / 检查 / 测试
# activity/tests 和 integration 用 testcontainers 起数据库，依赖 runner 自带的 Docker
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # web / x / admin 是私有仓库，go 下载时要走 git + token，不能走公共代理
  GOPRIVATE: github.com/r0vx/*

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # admin/media/vips 通过 cgo 依赖 libvips
      - name: 安装 libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev
      - name: 配置私有模块访问
        env:
          TOKEN: ${{ secrets.R0VX_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/r0vx/".insteadOf "https://github.com/r0vx/"
      # commerce 不在上面令牌的仓库范围内：用它的只读部署密钥经 SSH 拉取（insteadOf 取最长匹配，只影响 commerce）
      - name: 配置 commerce 访问（只读部署密钥）
        env:
          KEY: ${{ secrets.COMMERCE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_commerce
          chmod 600 ~/.ssh/id_commerce
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/id_commerce -o IdentitiesOnly=yes"
          git config --global url."git@github.com:r0vx/commerce".insteadOf "https://github.com/r0vx/commerce"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
